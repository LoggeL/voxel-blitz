<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="./assets/brand/favicon-32.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VOXEL BLITZ FPV Handset Capture</title>
  <style>
    /* A map still behind a transparent WebGL canvas (tools/fpv-handset-capture.mjs). */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #1d2a30 url('./assets/maps/frontier.jpg') center / cover no-repeat; }
    #capture { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    #capture-label { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); font: 600 10px sans-serif; color: #ffffff70; letter-spacing: 1px; }
  </style>
</head>
<body>
  <canvas id="capture" aria-label="VOXEL BLITZ FPV handset capture"></canvas>
  <div id="capture-label"></div>
  <script type="module" src="./js/capture/fpv-handset-capture.js"></script>
</body>
</html>
