  <div class="vb-loading-body">
    <div class="vb-loading-brand" aria-hidden="true"><span>VOXEL</span><span>BLITZ</span></div>
    <div id="loading-context">WELCOME TO VOXEL BLITZ</div>
    <h1 id="loading-title">GEARING UP</h1>
    <p id="loading-status" role="status" aria-live="polite">Loading game systems…</p>
    <ol id="loading-steps" class="vb-loading-steps" aria-label="Startup stages" hidden></ol>
  </div>

    <div class="vb-loading-meter"><div class="vb-loading-rail"><progress max="1" aria-label="Loading progress"></progress><span id="loading-percent" aria-hidden="true"></span></div><span id="loading-count" aria-hidden="true"></span></div>
    <p class="vb-loading-tip"><span>FIELD NOTES</span>Tune your scopes and grips in the Armory before deploying.</p>
    <button id="loading-action" type="button" hidden>CANCEL</button>
  </div>
  <noscript>Enable JavaScript to play Voxel Blitz.</noscript>
</dialog>
<canvas id="game"></canvas>
<div id="hud" class="hidden"></div>
