<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="./assets/brand/favicon-32.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VOXEL BLITZ Interaction Capture</title>
  <style>
    /* The hold animations on the real viewmodel rig and avatar (tools/interact-anims-capture.mjs). */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #8fb4cf; }
    #capture { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    #capture-label { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); font: 600 10px sans-serif; color: #ffffffa0; letter-spacing: 1px; }
  </style>
</head>
<body>
  <canvas id="capture" aria-label="VOXEL BLITZ interaction capture"></canvas>
  <div id="capture-label"></div>
  <script type="module" src="./js/capture/interact-anim-capture.js"></script>
</body>
</html>
