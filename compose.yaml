services:
  game:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VB_PERSISTENCE: postgres
      PORT: "8070"
      DATABASE_URL: "postgresql://voxel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/voxel"
      VB_PUBLIC_ORIGIN: "${VB_PUBLIC_ORIGIN:-}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8070}:8070"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8070/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 20s
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voxel
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel -d voxel"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
networks:
  frontend:
  database:
    internal: true
volumes:
  postgres-data:
